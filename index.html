<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Phonics Quest 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F0E17;
  --surface: #1A1829;
  --card: #221F35;
  --border: #2E2A45;
  --text: #FFFFFE;
  --muted: #8B87A8;
  --accent1: #FF6B6B;
  --accent2: #4ECDC4;
  --accent3: #FFE66D;
  --accent4: #A78BFA;
  --accent5: #34D399;
  --accent6: #FB923C;
  --r: 18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;flex-direction:column;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(167,139,250,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 90%, rgba(78,205,196,0.06) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}

/* ─── LAYOUT ─── */
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* ─── SCROLLABLE CONTENT ─── */
.scroll-area{flex:1;overflow-y:auto;padding:16px 16px 80px;-webkit-overflow-scrolling:touch;}
.scroll-area::-webkit-scrollbar{width:4px;}
.scroll-area::-webkit-scrollbar-track{background:transparent;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ─── TOP BAR ─── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;flex-shrink:0;
}
.logo{font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.logo .q{color:var(--accent1);}
.logo .u{color:var(--accent3);}
.logo .e{color:var(--accent2);}
.logo .s{color:var(--accent4);}
.logo .t{color:var(--accent5);}

.topbar-right{display:flex;align-items:center;gap:10px;}
.streak{font-size:13px;font-weight:800;color:var(--accent3);}
.xp-pill{
  background:var(--card);border:1px solid var(--border);
  border-radius:99px;padding:5px 12px;
  font-size:13px;font-weight:800;color:var(--accent4);
  display:flex;align-items:center;gap:4px;
}

/* ─── SCREENS ─── */
.screen{display:none;}
.screen.active{display:flex;flex-direction:column;height:100%;}

/* ─── HOME ─── */
.home-hero{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:16px;
  display:flex;align-items:center;gap:16px;
}
.hero-art{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent4),var(--accent1));
  display:flex;align-items:center;justify-content:center;
  font-size:32px;flex-shrink:0;
}
.hero-text h2{font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;margin-bottom:4px;}
.hero-text p{font-size:13px;color:var(--muted);font-weight:600;line-height:1.4;}
.global-progress{margin-top:10px;}
.gp-bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
.gp-fill{height:100%;background:linear-gradient(90deg,var(--accent4),var(--accent2));border-radius:99px;transition:width .6s ease;}
.gp-label{font-size:11px;font-weight:800;color:var(--muted);margin-top:4px;}

.section-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;margin-top:4px;}

.levels-list{display:flex;flex-direction:column;gap:8px;}

.level-row{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:transform .15s,border-color .2s;
  position:relative;overflow:hidden;
}
.level-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.level-row:hover{transform:translateX(3px);border-color:var(--accent4);}
.level-row.locked{opacity:.45;cursor:default;}
.level-row.locked:hover{transform:none;border-color:var(--border);}

.level-icon{
  width:46px;height:46px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.level-info{flex:1;min-width:0;}
.level-name{font-family:'Baloo 2',cursive;font-size:16px;font-weight:700;margin-bottom:2px;}
.level-sub{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.level-meta{display:flex;align-items:center;gap:6px;margin-top:5px;}
.level-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
.level-fill{height:100%;border-radius:99px;transition:width .5s ease;}
.level-count{font-size:11px;font-weight:800;color:var(--muted);}

.lock-icon{font-size:18px;color:var(--muted);}
.check-icon{font-size:20px;}

/* ─── LESSON LIST ─── */
.back-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.back-btn{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;
  color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;
}
.back-btn:hover{border-color:var(--accent2);}
.list-title{font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;}

.lessons-grid{display:flex;flex-direction:column;gap:8px;}

.lesson-row{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:14px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:all .15s;
}
.lesson-row:hover{border-color:var(--accent2);transform:translateX(3px);}
.lesson-row.done{border-color:rgba(52,211,153,.3);}
.lesson-row.locked{opacity:.4;cursor:default;}
.lesson-row.locked:hover{transform:none;border-color:var(--border);}

.ln-num{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',cursive;font-size:14px;font-weight:800;
  flex-shrink:0;background:var(--border);color:var(--muted);
}
.lesson-row.done .ln-num{background:rgba(52,211,153,.15);color:var(--accent5);}

.ln-info{flex:1;}
.ln-name{font-weight:800;font-size:14px;margin-bottom:1px;}
.ln-words{font-size:12px;color:var(--muted);font-weight:600;}
.ln-stars{font-size:14px;letter-spacing:1px;}

/* ─── LESSON SCREEN ─── */
.lesson-top{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 8px;flex-shrink:0;
}
.close-btn{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;flex-shrink:0;color:var(--muted);
}
.close-btn:hover{border-color:var(--accent1);color:var(--accent1);}
.prog-wrap{flex:1;}
.prog-bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width .4s ease;}
.prog-label{font-size:11px;font-weight:800;color:var(--muted);margin-top:3px;text-align:center;}

.phase-strip{
  display:flex;gap:4px;padding:0 16px 10px;flex-shrink:0;
}
.phase-pip{
  flex:1;height:4px;border-radius:99px;background:var(--border);
  transition:background .3s;
}
.phase-pip.active{background:var(--accent3);}
.phase-pip.done-p{background:var(--accent5);}

.lesson-body{flex:1;overflow-y:auto;padding:0 16px;-webkit-overflow-scrolling:touch;}
.lesson-body::-webkit-scrollbar{width:3px;}
.lesson-body::-webkit-scrollbar-thumb{background:var(--border);}

/* ─── LEARN CARD ─── */
.learn-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 20px;margin-bottom:14px;
  text-align:center;
}
.lc-tag{
  display:inline-block;background:rgba(167,139,250,.15);
  color:var(--accent4);border-radius:99px;
  padding:4px 12px;font-size:12px;font-weight:800;
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;
}
.lc-rule{
  font-family:'Baloo 2',cursive;font-size:48px;font-weight:800;
  letter-spacing:6px;margin-bottom:10px;line-height:1;
}
.lc-rule .hl{color:var(--accent1);}
.lc-rule .hl2{color:var(--accent3);}
.lc-desc{font-size:15px;color:var(--muted);font-weight:600;line-height:1.5;margin-bottom:20px;}
.lc-rule-box{
  background:var(--bg);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;margin-bottom:20px;
  font-size:14px;font-weight:700;color:var(--text);line-height:1.5;
  text-align:left;
}
.lc-rule-box .rule-text{color:var(--accent3);}

.examples-label{font-size:12px;font-weight:800;color:var(--muted);text-align:left;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}
.examples-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ex-chip{
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;padding:12px 8px;text-align:center;
  cursor:pointer;transition:all .15s;
}
.ex-chip:hover{border-color:var(--accent2);transform:scale(1.02);}
.ex-chip:active{transform:scale(.96);}
.ex-emoji{font-size:26px;margin-bottom:4px;}
.ex-word{font-family:'Baloo 2',cursive;font-size:19px;font-weight:700;}
.ex-word .hl{color:var(--accent1);}
.ex-tap{font-size:10px;color:var(--muted);font-weight:700;margin-top:3px;}

/* ─── QUICK CHECK banner ─── */
.qc-banner{
  background:linear-gradient(135deg,rgba(52,211,153,.1),rgba(78,205,196,.1));
  border:1px solid rgba(52,211,153,.25);
  border-radius:var(--r);padding:14px 18px;margin-bottom:14px;
  display:flex;align-items:center;gap:12px;
}
.qc-icon{font-size:28px;}
.qc-text h4{font-size:14px;font-weight:800;color:var(--accent5);margin-bottom:2px;}
.qc-text p{font-size:12px;color:var(--muted);font-weight:600;}

/* ─── QUIZ ─── */
.quiz-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 20px;margin-bottom:14px;text-align:center;
}
.qz-prompt{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px;letter-spacing:.3px;}
.qz-main{font-family:'Baloo 2',cursive;font-size:36px;font-weight:800;margin-bottom:6px;color:var(--text);}
.qz-sub{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:18px;}

.speak-btn{
  background:linear-gradient(135deg,var(--accent2),#26A69A);
  border:none;border-radius:99px;padding:12px 24px;
  font-family:'Baloo 2',cursive;font-size:17px;color:#0F0E17;font-weight:800;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 4px 20px rgba(78,205,196,.3);
  transition:transform .1s,box-shadow .1s;margin-bottom:18px;
}
.speak-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(78,205,196,.4);}
.speak-btn:active{transform:scale(.96);}
.speak-btn.speaking{animation:speakPulse .5s infinite alternate;}
@keyframes speakPulse{from{transform:scale(1);}to{transform:scale(1.06);}}

.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.opt-btn{
  background:var(--bg);border:2px solid var(--border);
  border-radius:13px;padding:16px 10px;
  font-family:'Baloo 2',cursive;font-size:19px;font-weight:700;
  color:var(--text);cursor:pointer;transition:all .15s;
}
.opt-btn:hover{border-color:var(--accent2);background:rgba(78,205,196,.06);}
.opt-btn.correct{background:rgba(52,211,153,.12);border-color:var(--accent5);color:var(--accent5);}
.opt-btn.wrong{background:rgba(255,107,107,.12);border-color:var(--accent1);color:var(--accent1);animation:shake .3s;}
.opt-btn:disabled{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

/* ─── WRITE ─── */
.write-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 20px;margin-bottom:14px;text-align:center;
}
.wt-prompt{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:16px;}
.blanks-row{display:flex;justify-content:center;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.blank-box{
  width:40px;height:48px;border-bottom:2.5px solid var(--border);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;
  font-family:'Baloo 2',cursive;font-size:24px;font-weight:700;
  transition:border-color .2s;
}
.blank-box.has-char{border-bottom-color:var(--accent2);}
.blank-box.correct-b{border-bottom-color:var(--accent5);color:var(--accent5);}
.blank-box.wrong-b{border-bottom-color:var(--accent1);color:var(--accent1);}
.write-input{
  width:100%;background:var(--bg);border:2px solid var(--border);
  border-radius:13px;padding:14px;
  font-family:'Baloo 2',cursive;font-size:28px;font-weight:700;
  color:var(--text);text-align:center;letter-spacing:6px;
  outline:none;transition:border-color .2s;
}
.write-input:focus{border-color:var(--accent2);}
.write-input.correct{border-color:var(--accent5);background:rgba(52,211,153,.06);color:var(--accent5);}
.write-input.wrong{border-color:var(--accent1);background:rgba(255,107,107,.06);color:var(--accent1);}
.wt-hint{font-size:12px;color:var(--muted);font-weight:700;margin-top:10px;}
.wt-progress{font-size:12px;font-weight:800;color:var(--accent4);margin-top:6px;}

/* ─── BUTTONS ─── */
.big-btn{
  width:100%;border:none;border-radius:14px;
  padding:16px;margin-top:8px;
  font-family:'Baloo 2',cursive;font-size:18px;font-weight:700;
  color:#0F0E17;cursor:pointer;
  transition:transform .1s,box-shadow .1s;
}
.big-btn:active{transform:scale(.98);}
.big-btn:disabled{opacity:.4;cursor:default;transform:none;}
.btn-primary{
  background:linear-gradient(135deg,var(--accent1),#FF8E53);
  box-shadow:0 4px 20px rgba(255,107,107,.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(255,107,107,.4);}
.btn-secondary{
  background:linear-gradient(135deg,var(--accent2),#26A69A);
  box-shadow:0 4px 20px rgba(78,205,196,.3);
}
.btn-secondary:hover{transform:translateY(-2px);}
.btn-ghost{
  background:var(--card);border:1px solid var(--border);
  color:var(--text);font-family:'Baloo 2',cursive;
}
.btn-ghost:hover{border-color:var(--accent4);}

/* ─── FEEDBACK ─── */
.feedback-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
  width:100%;max-width:480px;
  padding:18px 20px 28px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.feedback-bar.show{transform:translateX(-50%) translateY(0);}
.feedback-bar.fb-ok{background:var(--accent5);}
.feedback-bar.fb-err{background:var(--accent1);}
.fb-l{color:#0F0E17;}
.fb-emoji-big{font-size:30px;margin-bottom:2px;}
.fb-msg{font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;color:#0F0E17;}
.fb-detail{font-size:12px;font-weight:800;color:rgba(15,14,23,.7);}
.fb-next{
  background:rgba(15,14,23,.2);border:none;border-radius:12px;
  padding:12px 20px;font-family:'Baloo 2',cursive;font-size:16px;
  font-weight:800;color:#0F0E17;cursor:pointer;
  transition:background .15s;flex-shrink:0;
}
.fb-next:hover{background:rgba(15,14,23,.3);}

/* ─── COMPLETE ─── */
.complete-wrap{text-align:center;padding:30px 20px;}
.comp-emoji{font-size:80px;animation:compBounce .7s ease infinite alternate;}
@keyframes compBounce{from{transform:translateY(0);}to{transform:translateY(-14px);}}
.comp-title{font-family:'Baloo 2',cursive;font-size:32px;font-weight:800;margin:14px 0 6px;}
.comp-sub{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:24px;}
.comp-stars{display:flex;justify-content:center;gap:10px;margin-bottom:12px;}
.comp-star{font-size:46px;animation:starPop .4s ease both;}
.comp-star:nth-child(1){animation-delay:.1s;}
.comp-star:nth-child(2){animation-delay:.25s;}
.comp-star:nth-child(3){animation-delay:.4s;}
@keyframes starPop{from{transform:scale(0) rotate(-20deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.comp-xp{
  display:inline-block;background:rgba(167,139,250,.15);
  border:1px solid rgba(167,139,250,.3);border-radius:99px;
  padding:6px 18px;font-size:14px;font-weight:800;color:var(--accent4);
  margin-bottom:28px;
}

/* ─── QUICK CHECK MODE ─── */
.qc-result{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:14px;text-align:center;
}
.qc-score{font-family:'Baloo 2',cursive;font-size:48px;font-weight:800;margin-bottom:6px;}
.qc-verdict{font-size:15px;font-weight:800;margin-bottom:4px;}
.qc-detail{font-size:13px;color:var(--muted);font-weight:600;}

/* ─── CONFETTI ─── */
.confetti-c{position:fixed;inset:0;pointer-events:none;z-index:300;}
.cp{position:absolute;border-radius:2px;animation:cpFall linear forwards;}
@keyframes cpFall{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}

/* bottom padding for fixed feedback */
.lesson-foot{padding:8px 16px 16px;flex-shrink:0;}
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">
      <span class="q">P</span><span class="u">h</span><span class="e">o</span><span class="s">n</span><span class="t">ics</span>
      <span style="color:var(--accent3)"> Quest</span> ✨
    </div>
    <div class="topbar-right">
      <div class="streak" id="streakDisplay">🔥 0</div>
      <div class="xp-pill">⭐ <span id="xpDisplay">0</span></div>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div class="screen active" id="homeScreen">
    <div class="scroll-area">
      <div class="home-hero">
        <div class="hero-art">📚</div>
        <div class="hero-text">
          <h2>Your Phonics Journey</h2>
          <p>8 levels · 128 lessons · from easy to expert!</p>
          <div class="global-progress">
            <div class="gp-bar"><div class="gp-fill" id="globalFill" style="width:0%"></div></div>
            <div class="gp-label" id="globalLabel">0 / 128 lessons done</div>
          </div>
        </div>
      </div>
      <div class="section-label">Choose your level</div>
      <div class="levels-list" id="levelsList"></div>
    </div>
  </div>

  <!-- LESSONS LIST SCREEN -->
  <div class="screen" id="lessonsScreen">
    <div class="scroll-area">
      <div class="back-row">
        <button class="back-btn" onclick="goHome()">← Back</button>
        <div class="list-title" id="levelTitle"></div>
      </div>
      <div class="lessons-grid" id="lessonsList"></div>
    </div>
  </div>

  <!-- LESSON SCREEN -->
  <div class="screen" id="lessonScreen">
    <div class="lesson-top">
      <button class="close-btn" onclick="confirmExit()">✕</button>
      <div class="prog-wrap">
        <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        <div class="prog-label" id="progLabel">Step 1</div>
      </div>
    </div>
    <div class="phase-strip" id="phaseStrip"></div>
    <div class="lesson-body" id="lessonBody"></div>
    <div class="lesson-foot" id="lessonFoot"></div>
  </div>

  <!-- COMPLETE SCREEN -->
  <div class="screen" id="completeScreen">
    <div class="scroll-area">
      <div class="complete-wrap">
        <div class="comp-emoji" id="compEmoji">🎉</div>
        <div class="comp-title" id="compTitle">Amazing!</div>
        <div class="comp-sub" id="compSub">You nailed it!</div>
        <div class="comp-stars" id="compStars"></div>
        <div class="comp-xp" id="compXP">+20 XP</div>
        <button class="big-btn btn-primary" onclick="continueAfterLesson()" style="margin-bottom:10px">Next lesson →</button>
        <button class="big-btn btn-ghost" onclick="goLessons()">Back to list</button>
      </div>
    </div>
  </div>

</div><!-- /app -->

<!-- Feedback bar -->

let progress = JSON.parse(localStorage.getItem('pq_progress')||'{}');
let xp = parseInt(localStorage.getItem('pq_xp')||'0');
let streak = parseInt(localStorage.getItem('pq_streak')||'0');

let curLevelIdx = null;
let curLessonIdx = null;
let curLesson = null;
let curPhase = 0; // 0=learn, 1=quiz, 2=write
let quizIdx = 0;
let writeWords = [];
let writeIdx = 0;
let sessionCorrect = 0;
let sessionTotal = 0;
let feedbackLock = false;

// ═══════════════════════════════
// HELPERS
// ═══════════════════════════════
function speak(text, rate=0.8){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=rate; u.pitch=1.05;
  speechSynthesis.speak(u);
}
function save(){
  localStorage.setItem('pq_progress', JSON.stringify(progress));
  localStorage.setItem('pq_xp', xp);
  localStorage.setItem('pq_streak', streak);
}
function getLessonProgress(id){ return progress[id]||{stars:0,done:false}; }
function totalDone(){ return Object.values(progress).filter(p=>p.done).length; }

function allLessons(){
  const arr=[];
  LEVELS.forEach(lv=>lv.lessons.forEach(ls=>arr.push(ls)));
  return arr;
}

function isLevelLocked(lvIdx){
  if(lvIdx===0) return false;
  const prev = LEVELS[lvIdx-1];
  const doneCount = prev.lessons.filter(l=>getLessonProgress(l.id).done).length;
  return doneCount < Math.ceil(prev.lessons.length * 0.6);
}
function isLessonLocked(lvIdx, lsIdx){
  if(isLevelLocked(lvIdx)) return true;
  if(lsIdx===0) return false;
  return !getLessonProgress(LEVELS[lvIdx].lessons[lsIdx-1].id).done;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  hideFeedback();
}

// ═══════════════════════════════
// HOME
// ═══════════════════════════════
function goHome(){
  showScreen('homeScreen');
  renderHome();
}

function renderHome(){
  updateTopBar();
  const done = totalDone();
  const total = allLessons().length;
  document.getElementById('globalFill').style.width = (done/total*100)+'%';
  document.getElementById('globalLabel').textContent = `${done} / ${total} lessons done`;

  const list = document.getElementById('levelsList');
  list.innerHTML='';
  LEVELS.forEach((lv,lvIdx)=>{
    const locked = isLevelLocked(lvIdx);
    const doneCount = lv.lessons.filter(l=>getLessonProgress(l.id).done).length;
    const pct = Math.round(doneCount/lv.lessons.length*100);

    const row = document.createElement('div');
    row.className = 'level-row' + (locked?' locked':'');
    row.style.setProperty('--lc', lv.color);
    row.innerHTML = `
      <style>.level-row:nth-child(${lvIdx+1})::before{background:${lv.color};}</style>
      <div class="level-icon" style="background:${lv.bg}">${locked?'🔒':lv.icon}</div>
      <div class="level-info">
        <div class="level-name" style="color:${lv.color}">${lv.name}: ${lv.subtitle}</div>
        <div class="level-sub">${lv.lessons.length} lessons ${locked?'· Complete 60% of previous level to unlock':''}</div>
        <div class="level-meta">
          <div class="level-bar"><div class="level-fill" style="width:${pct}%;background:${lv.color}"></div></div>
          <div class="level-count">${doneCount}/${lv.lessons.length}</div>
          ${doneCount===lv.lessons.length?'<span class="check-icon">✅</span>':''}
        </div>
      </div>
    `;
    if(!locked) row.onclick = ()=>{ curLevelIdx=lvIdx; goLessons(); };
    list.appendChild(row);
  });
}

// ═══════════════════════════════
// LESSONS LIST
// ═══════════════════════════════
function goLessons(){
  showScreen('lessonsScreen');
  renderLessons();
}

function renderLessons(){
  const lv = LEVELS[curLevelIdx];
  document.getElementById('levelTitle').textContent = lv.name + ' ' + lv.icon;
  document.getElementById('levelTitle').style.color = lv.color;

  const list = document.getElementById('lessonsList');
  list.innerHTML='';
  lv.lessons.forEach((ls,lsIdx)=>{
    const locked = isLessonLocked(curLevelIdx, lsIdx);
    const lp = getLessonProgress(ls.id);
    const stars = lp.stars||0;

    const row = document.createElement('div');
    row.className = 'lesson-row'+(lp.done?' done':'')+(locked?' locked':'');
    row.innerHTML=`
      <div class="ln-num">${lp.done?'✓':(lsIdx+1)}</div>
      <div class="ln-info">
        <div class="ln-name">${ls.name}</div>
        <div class="ln-words">${ls.examples.map(e=>e.w).join(' · ')}</div>
      </div>
      <div class="ln-stars">${[1,2,3].map(i=>i<=stars?'⭐':'☆').join('')}</div>
    `;
    if(!locked) row.onclick = ()=>{ curLessonIdx=lsIdx; startLesson(ls); };
    list.appendChild(row);
  });
}

// ═══════════════════════════════
// LESSON
// ═══════════════════════════════
function startLesson(ls){
  curLesson = ls;
  curPhase = 0;
  quizIdx = 0;
  writeIdx = 0;
  sessionCorrect = 0;
  sessionTotal = 0;
  writeWords = [...ls.write].sort(()=>Math.random()-.5).slice(0, Math.min(3, ls.write.length));

  showScreen('lessonScreen');
  renderPhaseStrip();
  renderLearn();
}

function renderPhaseStrip(){
  const strip = document.getElementById('phaseStrip');
  strip.innerHTML = [0,1,2].map(i=>`
    <div class="phase-pip ${i<curPhase?'done-p':i===curPhase?'active':''}"></div>
  `).join('');
}

function setProgress(pct, label){
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progLabel').textContent = label;
  const colors = ['var(--accent2)','var(--accent4)','var(--accent5)'];
  document.getElementById('progFill').style.background = colors[curPhase]||colors[0];
}

// ── LEARN ──
function renderLearn(){
  curPhase=0; renderPhaseStrip();
  setProgress(20,'📖 Learn the rule');
  const ls = curLesson;

  const dispHTML = ls.display.map(p=>
    `<span style="${p.h?'color:var(--accent1)':''}">${p.t}</span>`
  ).join('');

  document.getElementById('lessonBody').innerHTML = `
    <div class="qc-banner">
      <div class="qc-icon">💡</div>
      <div class="qc-text">
        <h4>Tap each word to hear it!</h4>
        <p>Learn the rule, then we'll practice.</p>
      </div>
    </div>
    <div class="learn-card">
      <div class="lc-tag">${ls.tag}</div>
      <div class="lc-rule">${dispHTML}</div>
      <div class="lc-desc">${ls.rule}</div>
      <div class="lc-rule-box">${ls.ruleBox}</div>
      <div class="examples-label">🔊 Tap to hear</div>
      <div class="examples-row" id="examplesRow"></div>
    </div>
  `;
  document.getElementById('lessonFoot').innerHTML =`
    <button class="big-btn btn-primary" onclick="goToQuiz()">I'm ready — let's play! 🎯</button>
  `;

  const row = document.getElementById('examplesRow');
  ls.examples.forEach(ex=>{
    const chip = document.createElement('div');
    chip.className='ex-chip';
    chip.innerHTML=`
      <div class="ex-emoji">${ex.em}</div>
      <div class="ex-word">${highlightWord(ex.w, ls)}</div>
      <div class="ex-tap">tap to hear</div>
    `;
    chip.onclick=()=>{ speak(ex.w); chip.style.transform='scale(.94)'; setTimeout(()=>chip.style.transform='',180); };
    row.appendChild(chip);
  });

  setTimeout(()=>speak(ls.name,0.75), 500);
}

function highlightWord(word, ls){
  const pat = ls.tag;
  // highlight the pattern letters in red
  if(ls.display[0]){
    // find any highlighted display part in the word
    const hlParts = ls.display.filter(p=>p.h).map(p=>p.t.toLowerCase().replace(/[āēīōū]/g, m=>({ā:'a',ē:'e',ī:'i',ō:'o',ū:'u'}[m]||m)));
    for(const part of hlParts){
      if(word.includes(part)){
        return word.replace(part, `<span class="hl">${part}</span>`);
      }
    }
  }
  return word;
}

// ── QUIZ ──
function goToQuiz(){
  curPhase=1; quizIdx=0; renderPhaseStrip();
  renderQuizStep();
}

function renderQuizStep(){
  if(quizIdx >= curLesson.quiz.length){ goToWrite(); return; }
  const q = curLesson.quiz[quizIdx];
  const total = curLesson.quiz.length;
  setProgress(30 + (quizIdx/total)*35, `🎯 Question ${quizIdx+1} of ${total}`);

  const opts = [...q.opts].sort(()=>Math.random()-.5);
  document.getElementById('lessonBody').innerHTML=`
    <div class="quiz-card">
      <div class="qz-prompt">${q.q}</div>
      <div class="qz-main">Choose the right answer 👇</div>
      <div class="opts-grid" id="optsGrid"></div>
    </div>
  `;
  document.getElementById('lessonFoot').innerHTML='';

  const grid = document.getElementById('optsGrid');
  opts.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className='opt-btn';
    btn.textContent=opt;
    btn.onclick=()=>handleQuiz(opt, q.correct, btn);
    grid.appendChild(btn);
  });

  setTimeout(()=>speak(q.q, 0.85), 300);
}

function handleQuiz(chosen, correct, btn){
  if(feedbackLock) return;
  sessionTotal++;
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(chosen===correct){
    sessionCorrect++;
    btn.classList.add('correct');
    speak(correct);
    showFeedback(true, correct);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.textContent===correct) b.classList.add('correct'); });
    speak(correct);
    showFeedback(false, correct, 'Correct answer: '+correct);
  }
}

// ── WRITE ──
function goToWrite(){
  curPhase=2; writeIdx=0; renderPhaseStrip();
  renderWriteStep();
}

function renderWriteStep(){
  if(writeIdx >= writeWords.length){ finishLesson(); return; }
  const word = writeWords[writeIdx];
  const total = writeWords.length;
  setProgress(65 + (writeIdx/total)*30, `✏️ Word ${writeIdx+1} of ${total}`);

  document.getElementById('lessonBody').innerHTML=`
    <div class="write-card">
      <div class="wt-prompt">👂 Listen and type what you hear!</div>
      <button class="speak-btn" id="speakBtn" onclick="doSpeak()">🔊 Hear the word</button>
      <div class="blanks-row" id="blanksRow"></div>
      <input class="write-input" id="writeInput" type="text"
        autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off"
        placeholder="type here..."
        oninput="onWriteInput(this)"
        onkeydown="if(event.key==='Enter')checkWrite()">
      <div class="wt-hint">Spell it out! Every letter counts.</div>
      <div class="wt-progress">${writeIdx+1} / ${total}</div>
    </div>
  `;
  document.getElementById('lessonFoot').innerHTML=`
    <button class="big-btn btn-secondary" onclick="checkWrite()">Check ✓</button>
  `;

  renderBlanks(word, '');
  setTimeout(()=>doSpeak(), 500);
  setTimeout(()=>document.getElementById('writeInput')?.focus(), 600);
}

function doSpeak(){
  const word = writeWords[writeIdx];
  speak(word, 0.7);
  const btn = document.getElementById('speakBtn');
  if(btn){ btn.classList.add('speaking'); setTimeout(()=>btn.classList.remove('speaking'),1200); }
}

function renderBlanks(word, typed){
  const row = document.getElementById('blanksRow');
  if(!row) return;
  row.innerHTML = word.split('').map((l,i)=>{
    const t = typed[i]||'';
    return `<div class="blank-box${t?' has-char':''}">${t}</div>`;
  }).join('');
}

function onWriteInput(inp){
  const word = writeWords[writeIdx];
  renderBlanks(word, inp.value.toLowerCase());
  inp.classList.remove('correct','wrong');
}

function checkWrite(){
  const inp = document.getElementById('writeInput');
  if(!inp) return;
  const typed = inp.value.toLowerCase().trim();
  const correct = writeWords[writeIdx];
  sessionTotal++;
  inp.disabled=true;

  if(typed===correct){
    sessionCorrect++;
    inp.classList.add('correct');
    document.querySelectorAll('.blank-box').forEach(b=>b.classList.add('correct-b'));
    speak(correct);
    showFeedback(true, correct);
  } else {
    inp.classList.add('wrong');
    document.querySelectorAll('.blank-box').forEach(b=>b.classList.add('wrong-b'));
    speak(correct);
    showFeedback(false, correct, 'The word was: '+correct);
  }
}

// ═══════════════════════════════
// FEEDBACK
// ═══════════════════════════════
const OK_EMOJIS=['🎉','🌟','🔥','💪','🚀','✨','🎯','👏','⚡','🏆'];
const ERR_EMOJIS=['💪','🌱','🤗','😤','🙌'];

function showFeedback(ok, word, detail=''){
  feedbackLock=true;
  const bar=document.getElementById('feedbackBar');
  bar.className='feedback-bar show '+(ok?'fb-ok':'fb-err');
  document.getElementById('fbEmoji').textContent = ok
    ? OK_EMOJIS[Math.floor(Math.random()*OK_EMOJIS.length)]
    : ERR_EMOJIS[Math.floor(Math.random()*ERR_EMOJIS.length)];
  document.getElementById('fbMsg').textContent = ok ? 'Awesome! ⭐' : 'Not quite!';
  document.getElementById('fbDetail').textContent = detail||(ok?word+'! Great job!':'Correct: '+word);
}

function hideFeedback(){
  feedbackLock=false;
  document.getElementById('feedbackBar').classList.remove('show');
}

function nextStep(){
  hideFeedback();
  if(curPhase===1){
    quizIdx++;
    if(quizIdx>=curLesson.quiz.length) goToWrite();
    else renderQuizStep();
  } else if(curPhase===2){
    writeIdx++;
    if(writeIdx>=writeWords.length) finishLesson();
    else renderWriteStep();
  }
}

// ═══════════════════════════════
// FINISH
// ═══════════════════════════════
function finishLesson(){
  hideFeedback();
  const acc = sessionTotal>0 ? sessionCorrect/sessionTotal : 0;
  const stars = acc>=0.9?3:acc>=0.6?2:1;
  const xpEarned = stars*15;

  const prev = getLessonProgress(curLesson.id);
  if(stars>=(prev.stars||0)){
    progress[curLesson.id]={stars, done:true};
    xp+=xpEarned;
    save();
  }

  if(stars===3) launchConfetti();

  showScreen('completeScreen');
  const emojis=['🎉','⭐','🏆'];
  const titles=['Nice work!','Great job!','Perfect!'];
  const subs=[
    `${stars} star${stars>1?'s':''}! Keep going to build confidence!`,
    `${xpEarned} XP earned! You're on a roll!`,
    `Flawless! Every answer was correct! 🔥`
  ];
  document.getElementById('compEmoji').textContent=emojis[stars-1];
  document.getElementById('compTitle').textContent=titles[stars-1];
  document.getElementById('compSub').textContent=subs[stars-1];
  document.getElementById('compXP').textContent=`+${xpEarned} XP`;
  document.getElementById('compStars').innerHTML=[1,2,3].map(i=>
    `<div class="comp-star">${i<=stars?'⭐':'☆'}</div>`
  ).join('');

  updateTopBar();
}

function continueAfterLesson(){
  // go to next lesson if available
  const lv = LEVELS[curLevelIdx];
  const nextIdx = curLessonIdx+1;
  if(nextIdx < lv.lessons.length && !isLessonLocked(curLevelIdx, nextIdx)){
    curLessonIdx=nextIdx;
    startLesson(lv.lessons[nextIdx]);
  } else {
    goLessons();
  }
}

function confirmExit(){
  if(confirm('Leave this lesson? Progress won\'t be saved.')) goLessons();
}

// ═══════════════════════════════
// UI HELPERS
// ═══════════════════════════════
function updateTopBar(){
  document.getElementById('xpDisplay').textContent=xp;
  document.getElementById('streakDisplay').textContent='🔥 '+streak;
}

function launchConfetti(){
  const c=document.getElementById('confettiC');
  const colors=['#FF6B6B','#4ECDC4','#FFE66D','#A78BFA','#34D399','#FB923C'];
  c.innerHTML='';
  for(let i=0;i<70;i++){
    const p=document.createElement('div');
    p.className='cp';
    p.style.cssText=`
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${7+Math.random()*7}px;height:${7+Math.random()*7}px;
      border-radius:${Math.random()>.5?'50%':'2px'};
      animation-duration:${1.5+Math.random()*1.5}s;
      animation-delay:${Math.random()*.4}s;
    `;
    c.appendChild(p);
  }
  setTimeout(()=>c.innerHTML='',3000);
}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
goHome();
</script>
